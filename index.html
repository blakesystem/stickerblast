<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sticker Board">
<title>✦ Sticker Board</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --red: #E4000F;
    --navy: #1a1a2e;
    --yellow: #F9D308;
    --white: #ffffff;
    --page-bg: #f5f0ff;
    --theme-mid: #ede5ff;
    --theme-dot: #c4b5ff;
    --theme-btn: #6B4FBB;
    --theme-btn-txt: #ffffff;
  }

  html, body {
    height: 100%; width: 100%;
    overflow: hidden;
    background: #111;
    font-family: 'Nunito', sans-serif;
    -webkit-tap-highlight-color: transparent;
    -webkit-font-smoothing: antialiased;
  }

  #shell {
    display: flex;
    flex-direction: column;
    height: 100svh;
    max-width: 430px;
    margin: 0 auto;
    background: var(--page-bg);
    overflow: hidden;
    position: relative;
    transition: background 0.7s ease;
  }

  /* ── TOP BAR ── */
  .topbar {
    background: var(--red);
    padding: env(safe-area-inset-top, 10px) 16px 10px;
    padding-top: max(env(safe-area-inset-top), 10px);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 3px solid var(--navy);
    z-index: 10;
  }
  .topbar-left { display: flex; flex-direction: column; }
  .topbar-title {
    font-family: 'Fredoka One', cursive;
    font-size: 20px; color: #fff; letter-spacing: 0.5px; line-height: 1;
  }
  .topbar-sub {
    font-size: 11px; color: rgba(255,255,255,0.85);
    font-weight: 700; letter-spacing: 0.6px; margin-top: 1px;
    text-transform: uppercase;
  }
  .topbar-right {
    display: flex; flex-direction: column; align-items: flex-end; gap: 5px;
  }
  .topbar-badge {
    background: var(--yellow); color: var(--navy);
    border-radius: 12px; font-size: 11px; font-weight: 700;
    padding: 4px 10px; border: 2px solid var(--navy);
    font-family: 'Fredoka One', cursive; white-space: nowrap;
  }
  .topbar-total {
    background: var(--navy); color: var(--yellow);
    border-radius: 12px; font-size: 11px; font-weight: 700;
    padding: 4px 10px; border: 2px solid var(--yellow);
    font-family: 'Fredoka One', cursive; white-space: nowrap;
    display: none;
  }
  .topbar-total.visible { display: block; }

  /* ── PAGES ── */
  .page { flex: 1; overflow-y: auto; display: none; flex-direction: column; -webkit-overflow-scrolling: touch; }
  .page.active { display: flex; }

  /* ── BOTTOM TABS ── */
  .tabs {
    display: flex;
    background: var(--navy);
    border-top: 3px solid var(--navy);
    flex-shrink: 0;
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .tab-btn {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; gap: 2px;
    padding: 8px 4px 10px;
    border: none; background: none; cursor: pointer;
    color: rgba(255,255,255,0.4);
    font-size: 9px; font-family: 'Nunito', sans-serif;
    font-weight: 700; letter-spacing: 0.4px; text-transform: uppercase;
    transition: color 0.15s;
  }
  .tab-btn i { font-size: 22px; }
  .tab-btn.active { color: var(--yellow); }

  /* ── CAROUSEL ── */
  #page-carousel {
    padding: 16px 0 28px;
    gap: 22px;
  }
  .carousel-scene {
    width: 100%;
    padding: 0 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }

  /* slide container — clips the animation */
  .slide-window {
    width: 100%;
    overflow: hidden;
    border-radius: 18px;
    border: 3px solid var(--navy);
    position: relative;
  }

  /* the actual card slides inside the window */
  .c-card {
    width: 100%;
    background: var(--white);
    display: flex;
    flex-direction: column;
    position: relative;
    /* slide animations applied via JS */
    transition: transform 0.42s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.42s ease;
  }
  .c-card.slide-in-right  { animation: slideInRight  0.42s cubic-bezier(0.4,0,0.2,1) both; }
  .c-card.slide-out-left  { animation: slideOutLeft  0.42s cubic-bezier(0.4,0,0.2,1) both; }
  .c-card.slide-in-left   { animation: slideInLeft   0.42s cubic-bezier(0.4,0,0.2,1) both; }
  .c-card.slide-out-right { animation: slideOutRight 0.42s cubic-bezier(0.4,0,0.2,1) both; }

  @keyframes slideInRight  { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
  @keyframes slideOutLeft  { from { transform: translateX(0);    opacity: 1; } to { transform: translateX(-100%); opacity: 0; } }
  @keyframes slideInLeft   { from { transform: translateX(-100%);opacity: 0; } to { transform: translateX(0); opacity: 1; } }
  @keyframes slideOutRight { from { transform: translateX(0);    opacity: 1; } to { transform: translateX(100%); opacity: 0; } }

  .c-img-wrap {
    width: 100%; aspect-ratio: 4/3;
    background: var(--theme-mid);
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    transition: background 0.7s ease;
  }
  .c-img-wrap img {
    width: 100%; height: 100%; object-fit: contain; padding: 14px;
  }
  .c-no-img {
    display: flex; flex-direction: column; align-items: center;
    gap: 8px; color: #bbb;
  }
  .c-no-img i { font-size: 44px; }
  .c-no-img span { font-size: 12px; font-weight: 700; }

  .c-info {
    padding: 12px 14px 14px;
    background: var(--white);
    border-top: 2px solid var(--navy);
  }
  .c-name {
    font-family: 'Fredoka One', cursive;
    font-size: 18px; color: var(--navy); margin-bottom: 2px;
  }
  .c-cat {
    font-size: 11px; font-weight: 700; color: #666;
    text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px;
  }

  /* ── CATEGORY ROWS (below carousel) ── */
  #cat-sections { display: flex; flex-direction: column; gap: 18px; width: 100%; }
  .cat-section { width: 100%; }
  .cat-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 16px; margin-bottom: 8px;
  }
  .cat-title {
    font-family: 'Fredoka One', cursive;
    font-size: 15px; color: var(--navy);
    letter-spacing: 0.6px; text-transform: uppercase;
  }
  .cat-count {
    font-size: 11px; font-weight: 700;
    color: var(--theme-btn);
    background: var(--theme-mid);
    padding: 2px 8px; border-radius: 8px;
    border: 2px solid var(--navy);
  }
  .cat-row {
    display: flex; gap: 10px;
    overflow-x: auto; scrollbar-width: none;
    padding: 4px 16px 6px;
    scroll-snap-type: x proximity;
    -webkit-overflow-scrolling: touch;
  }
  .cat-row::-webkit-scrollbar { display: none; }
  .cat-tile {
    flex: 0 0 118px;
    width: 118px;
    scroll-snap-align: start;
    background: var(--white);
    border: 2.5px solid var(--navy);
    border-radius: 12px;
    overflow: hidden;
    cursor: pointer;
    text-decoration: none;
    color: inherit;
    display: flex; flex-direction: column;
    transition: transform 0.12s;
    position: relative;
  }
  .cat-tile:active { transform: scale(0.95); }
  .cat-tile-img {
    width: 100%; aspect-ratio: 1/1;
    background: #f8f4ff;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    position: relative;
  }
  .cat-tile-img img { width: 100%; height: 100%; object-fit: contain; padding: 5px; }
  .cat-tile-img > i { font-size: 26px; color: #c4b5ff; }
  .cat-tile-meta {
    padding: 5px 7px 6px;
    border-top: 2px solid var(--navy);
    background: var(--white);
  }
  .cat-tile-name {
    font-size: 11px; font-weight: 700; color: var(--navy);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .cat-tile-price {
    font-family: 'Fredoka One', cursive;
    font-size: 11px; color: var(--theme-btn);
    margin-top: 1px;
  }
  .cat-tile-cart {
    position: absolute; top: 4px; right: 4px;
    width: 22px; height: 22px; border-radius: 50%;
    background: var(--theme-btn); color: var(--white);
    border: 2px solid var(--navy);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 1.5px 0 var(--navy);
    z-index: 2;
  }
  .cat-tile-cart i { font-size: 11px; }
  .cat-tile .new-tag {
    top: 4px; left: 4px;
    font-size: 8px; padding: 2px 6px;
    border-radius: 6px;
  }
  .cat-see-tile {
    flex: 0 0 96px;
    width: 96px;
    scroll-snap-align: start;
    background: var(--theme-mid);
    border: 2.5px dashed var(--navy);
    border-radius: 12px;
    cursor: pointer;
    color: var(--navy);
    font-family: 'Fredoka One', cursive;
    font-size: 13px;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 6px;
    transition: transform 0.12s, background 0.2s;
    letter-spacing: 0.4px;
    font-family: 'Nunito', sans-serif;
    font-weight: 700; text-transform: uppercase;
  }
  .cat-see-tile:active { transform: scale(0.95); background: var(--theme-dot); }
  .cat-see-tile i { font-size: 26px; color: var(--theme-btn); }

  /* dots */
  .dots { display: flex; gap: 6px; align-items: center; }
  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--theme-dot); border: 2px solid var(--navy);
    transition: all 0.3s;
  }
  .dot.on { background: var(--theme-btn); width: 22px; border-radius: 4px; }

  /* nav arrows */
  .ctrl-row { display: flex; align-items: center; gap: 14px; }
  .ctrl-btn {
    width: 46px; height: 46px; border-radius: 50%;
    border: 3px solid var(--navy);
    background: var(--navy);
    color: var(--yellow);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: transform 0.12s, background 0.15s;
    flex-shrink: 0;
  }
  .ctrl-btn:hover { background: #2d2d50; }
  .ctrl-btn:active { transform: scale(0.92); }
  .ctrl-btn i { font-size: 20px; }

  /* counter badge between arrows */
  .slide-counter {
    font-family: 'Fredoka One', cursive;
    font-size: 14px; color: var(--navy);
    min-width: 60px; text-align: center;
  }

  /* empty state */
  .c-empty {
    text-align: center; color: #888;
    padding: 30px 20px; width: 100%;
    display: flex; flex-direction: column; align-items: center; gap: 14px;
  }
  .c-empty i { font-size: 52px; color: var(--theme-dot); }
  .c-empty p { font-size: 14px; font-weight: 700; }
  .go-add-btn {
    padding: 12px 24px; border-radius: 14px;
    border: 3px solid var(--navy);
    background: var(--red); color: var(--white);
    cursor: pointer; font-size: 14px; font-weight: 700;
    font-family: 'Nunito', sans-serif;
    transition: transform 0.12s;
  }
  .go-add-btn:active { transform: scale(0.96); }

  /* ── LIBRARY ── */
  #page-library { padding: 0; }
  .lib-actions {
    display: flex; gap: 8px;
    padding: 10px 12px 8px;
    background: var(--white);
    flex-shrink: 0;
  }
  .lib-action-btn {
    flex: 1; padding: 8px 10px;
    border-radius: 10px;
    border: 2.5px solid var(--navy);
    background: var(--white); color: var(--navy);
    font-size: 11px; font-weight: 700;
    font-family: 'Nunito', sans-serif;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 5px;
    letter-spacing: 0.4px; text-transform: uppercase;
    transition: transform 0.12s, background 0.15s;
  }
  .lib-action-btn:active { transform: scale(0.96); background: #f5f0ff; }
  .lib-action-btn i { font-size: 15px; }
  .lib-pills {
    display: flex; gap: 6px; padding: 10px 12px;
    overflow-x: auto; scrollbar-width: none;
    background: var(--white); border-bottom: 2px solid #eee;
    flex-shrink: 0;
  }
  .lib-pills::-webkit-scrollbar { display: none; }
  .pill {
    flex-shrink: 0; padding: 6px 13px; border-radius: 14px;
    font-size: 11px; font-weight: 700; cursor: pointer;
    border: 2.5px solid var(--navy);
    background: var(--white); color: var(--navy);
    font-family: 'Nunito', sans-serif; transition: all 0.15s;
    letter-spacing: 0.3px;
  }
  .pill.on { background: var(--navy); color: var(--yellow); }

  .lib-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px; padding: 12px;
  }
  .lib-card {
    background: var(--white);
    border: 2.5px solid var(--navy);
    border-radius: 14px; overflow: hidden;
    cursor: pointer; position: relative;
    transition: transform 0.15s;
  }
  .lib-card:hover { transform: scale(1.02); }
  .lib-img-wrap {
    position: relative;
    width: 100%; aspect-ratio: 1/1;
  }
  .lib-img {
    width: 100%; height: 100%;
    object-fit: contain; background: #f8f4ff; padding: 6px;
    display: block;
  }
  .lib-no-img {
    width: 100%; height: 100%;
    background: #f5f0ff;
    display: flex; align-items: center; justify-content: center; color: #c4b5ff;
  }
  .lib-no-img i { font-size: 32px; }
  .lib-meta { padding: 7px 9px; border-top: 2px solid var(--navy); background: var(--white); }
  .lib-name {
    font-size: 12px; font-weight: 700; color: var(--navy);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .lib-cat {
    font-size: 10px; font-weight: 700; color: #777;
    text-transform: uppercase; letter-spacing: 0.4px; margin-top: 1px;
  }
  .lib-price {
    font-family: 'Fredoka One', cursive;
    font-size: 12px; color: var(--theme-btn); margin-top: 3px;
    letter-spacing: 0.3px;
  }
  .del-x {
    position: absolute; top: 5px; right: 5px;
    width: 22px; height: 22px; border-radius: 50%;
    background: rgba(228, 0, 15, 0.92); color: var(--white);
    border: 2px solid var(--navy);
    cursor: pointer; display: flex;
    align-items: center; justify-content: center;
    font-size: 13px; font-weight: 700; font-family: sans-serif;
    line-height: 1; z-index: 3;
  }
  .lib-cart {
    position: absolute; bottom: 5px; right: 5px;
    width: 32px; height: 32px; border-radius: 50%;
    background: var(--theme-btn); color: var(--white);
    border: 2.5px solid var(--navy);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    z-index: 3;
    box-shadow: 0 2px 0 var(--navy);
    text-decoration: none;
    transition: transform 0.12s, background 0.15s;
  }
  .lib-cart:active { transform: scale(0.88); }
  .lib-cart i { font-size: 16px; }

  .lib-empty {
    grid-column: 1/-1; text-align: center;
    padding: 40px 16px; color: #aaa;
  }
  .lib-empty i { font-size: 40px; margin-bottom: 10px; display: block; color: #c4b5ff; }
  .lib-empty p { font-size: 13px; font-weight: 700; }

  /* ── ADD PAGE ── */
  #page-add { padding: 0; }
  .add-inner { padding: 16px; display: flex; flex-direction: column; gap: 12px; }

  .dz {
    border: 3px dashed #c4b5ff; border-radius: 16px;
    min-height: 140px; display: flex;
    align-items: center; justify-content: center;
    cursor: pointer; background: #f8f4ff;
    transition: border-color 0.15s; overflow: hidden;
  }
  .dz:hover { border-color: #9f86ff; }
  .dz-hint { text-align: center; color: #888; padding: 16px; }
  .dz-hint i { font-size: 36px; color: #c4b5ff; margin-bottom: 6px; display: block; }
  .dz-hint p { font-size: 13px; font-weight: 700; }
  .dz-hint span { font-size: 11px; color: #aaa; display: block; margin-top: 3px; }
  .dz img { max-width: 100%; max-height: 170px; object-fit: contain; padding: 12px; }

  .fl { display: flex; flex-direction: column; gap: 4px; }
  .fl label {
    font-size: 11px; font-weight: 700; color: #666;
    text-transform: uppercase; letter-spacing: 0.5px;
  }
  .fi, .fs {
    width: 100%; padding: 10px 12px; border-radius: 12px;
    border: 2.5px solid #ddd5ff;
    font-size: 14px; font-weight: 600;
    background: var(--white); color: var(--navy);
    font-family: 'Nunito', sans-serif;
    transition: border-color 0.15s; outline: none;
  }
  .fi:focus, .fs:focus { border-color: #9f86ff; }

  .paste-note { font-size: 11px; color: #aaa; text-align: center; font-weight: 600; }

  .save-btn {
    width: 100%; padding: 14px;
    border-radius: 14px; border: 3px solid var(--navy);
    background: var(--red); color: var(--white);
    font-size: 16px; font-weight: 700;
    font-family: 'Fredoka One', cursive;
    cursor: pointer; letter-spacing: 0.5px;
    transition: transform 0.12s, background 0.15s;
  }
  .save-btn:hover { background: #c0000d; }
  .save-btn:active { transform: scale(0.97); }

  .toast {
    text-align: center; font-size: 13px; font-weight: 700;
    color: #0F6E56; opacity: 0;
    transition: opacity 0.3s; letter-spacing: 0.3px;
  }

  /* ── NEW! TAGS & POLISH ── */
  .new-tag {
    position: absolute;
    top: 6px; left: 6px;
    background: var(--red);
    color: var(--yellow);
    font-family: 'Fredoka One', cursive;
    font-size: 10px;
    padding: 3px 8px;
    border: 2px solid var(--navy);
    border-radius: 8px;
    letter-spacing: 0.6px;
    z-index: 3;
    box-shadow: 0 2px 0 var(--navy);
    transform: rotate(-8deg);
    animation: tagWiggle 1.8s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes tagWiggle {
    0%, 100% { transform: rotate(-8deg) scale(1); }
    50%      { transform: rotate(-4deg) scale(1.08); }
  }

  .c-new-tag {
    position: absolute;
    top: 12px; left: 12px;
    background: var(--red);
    color: var(--yellow);
    font-family: 'Fredoka One', cursive;
    font-size: 14px;
    padding: 6px 14px;
    border: 3px solid var(--navy);
    border-radius: 12px;
    letter-spacing: 0.8px;
    z-index: 6;
    box-shadow: 0 3px 0 var(--navy);
    transform: rotate(-8deg);
    animation: tagPop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) both,
               tagWiggle 1.8s 0.6s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes tagPop {
    0%   { transform: rotate(40deg)  scale(0);   opacity: 0; }
    60%  { transform: rotate(-15deg) scale(1.2); opacity: 1; }
    100% { transform: rotate(-8deg)  scale(1);   opacity: 1; }
  }

  .c-card.is-new .c-img-wrap {
    animation: newGlow 2.4s ease-in-out infinite;
  }
  @keyframes newGlow {
    0%, 100% { box-shadow: inset 0 0 0 0 rgba(249, 211, 8, 0); }
    50%      { box-shadow: inset 0 0 40px rgba(249, 211, 8, 0.55); }
  }

  .sparkle-burst {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 5;
    overflow: hidden;
  }
  .sparkle-burst .sparkle {
    position: absolute;
    top: 42%; left: 50%;
    font-size: 18px;
    opacity: 0;
    animation: sparkleFly 1.1s ease-out forwards;
  }
  @keyframes sparkleFly {
    0%   { transform: translate(-50%, -50%) scale(0) rotate(0deg); opacity: 0; }
    15%  { opacity: 1; }
    100% { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.4) rotate(360deg); opacity: 0; }
  }

  .lib-card.just-added {
    animation: cardPop 0.65s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  }
  @keyframes cardPop {
    0%   { transform: scale(0.3) rotate(-12deg); opacity: 0; }
    60%  { transform: scale(1.1) rotate(3deg);   opacity: 1; }
    100% { transform: scale(1)   rotate(0deg);   opacity: 1; }
  }

  /* ── CAROUSEL POLISH ── */
  .discover-header {
    display: flex; align-items: center; justify-content: center;
    gap: 16px;
    width: 100%;
    padding: 0 16px;
  }
  .discover-title {
    font-family: 'Fredoka One', cursive;
    font-size: 22px;
    color: var(--navy);
    letter-spacing: 2.5px;
    text-shadow: 2px 2px 0 var(--yellow);
  }
  .discover-header .ds-spark {
    font-size: 20px;
    color: var(--theme-btn);
    display: inline-block;
    animation: dsRotate 4s ease-in-out infinite;
  }
  .discover-header .ds-spark.r { animation-delay: 0.6s; }
  @keyframes dsRotate {
    0%, 100% { transform: rotate(0) scale(1); }
    50%      { transform: rotate(180deg) scale(1.3); }
  }

  .slide-window {
    box-shadow: 0 6px 0 var(--navy), 0 12px 24px rgba(26, 26, 46, 0.18);
    cursor: pointer;
  }
  .c-img-wrap { position: relative; }

  /* ── PRICE TAG SHAPE (carousel + modal) ── */
  .price-tag {
    position: absolute;
    background: var(--yellow);
    color: var(--navy);
    font-family: 'Fredoka One', cursive;
    letter-spacing: 0.5px;
    white-space: nowrap;
    pointer-events: none;
    border: 3px solid var(--navy);
    border-radius: 10px 10px 10px 10px;
    box-shadow: 3px 3px 0 var(--navy);
    padding-left: 22px; /* room for the hole */
  }
  /* string-hole dot on the left */
  .price-tag::before {
    content: '';
    position: absolute;
    left: 8px; top: 50%;
    transform: translateY(-50%);
    width: 8px; height: 8px;
    background: var(--white);
    border: 2.5px solid var(--navy);
    border-radius: 50%;
  }

  .c-price-chip {
    top: auto; bottom: 12px; right: 6px;
    font-size: 13px;
    padding: 4px 12px 4px 26px;
    z-index: 4;
    transform: rotate(-6deg);
    transform-origin: right center;
    animation: chipPop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  }
  @keyframes chipPop {
    0%   { transform: rotate(-20deg) scale(0) translateX(10px); opacity: 0; }
    100% { transform: rotate(-6deg)  scale(1) translateX(0);    opacity: 1; }
  }

  /* modal price chip sizing */
  .modal-price-chip {
    font-size: 16px;
    padding: 6px 16px 6px 30px;
  }

  .c-tap-hint {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 11px; font-weight: 700;
    color: var(--theme-btn);
    text-transform: uppercase; letter-spacing: 0.6px;
    margin-top: 4px;
  }
  .c-tap-hint i {
    font-size: 14px;
    animation: tapPulse 1.4s ease-in-out infinite;
  }
  @keyframes tapPulse {
    0%, 100% { transform: translateY(0) scale(1); }
    50%      { transform: translateY(-2px) scale(1.15); }
  }

  /* decorative drifting sparkles in the carousel background */
  .bg-sparkles {
    position: absolute; inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 0;
  }
  .bg-sparkles .bs {
    position: absolute;
    font-size: 14px;
    color: var(--theme-dot);
    opacity: 0.55;
    animation: bsDrift 9s ease-in-out infinite;
  }
  @keyframes bsDrift {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50%      { transform: translateY(-22px) rotate(180deg); }
  }
  #page-carousel > * { position: relative; z-index: 1; }

  /* ── PASTE FIELDS ── */
  .paste-row {
    display: flex; align-items: center; gap: 10px;
    padding: 11px 14px;
    border-radius: 12px;
    border: 2.5px dashed #c4b5ff;
    background: var(--white);
    transition: border-color 0.15s, background 0.15s;
    cursor: text;
    min-height: 46px;
  }
  .paste-row:focus-within { border-color: #9f86ff; border-style: solid; }
  .paste-row.filled { border-color: #0F6E56; border-style: solid; background: #f0fff6; }
  .paste-row .pr-icon {
    font-size: 18px; flex-shrink: 0;
    color: #c4b5ff;
    display: flex; align-items: center;
    transition: color 0.15s;
  }
  .paste-row:focus-within .pr-icon,
  .paste-row.filled .pr-icon { color: #0F6E56; }
  .paste-row .pr-input {
    flex: 1; min-width: 0;
    border: none; background: transparent; outline: none;
    font-size: 13px; font-weight: 700;
    font-family: 'Nunito', sans-serif;
    color: var(--navy);
  }
  .paste-row .pr-input::placeholder { color: #bbb; font-weight: 600; }
  .paste-clear {
    width: 24px; height: 24px; border-radius: 50%;
    background: var(--red); color: var(--white);
    border: 2px solid var(--navy);
    font-size: 13px; font-weight: 700; font-family: sans-serif;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; flex-shrink: 0; line-height: 1; padding: 0;
    display: none;
  }
  .paste-row.filled .paste-clear { display: flex; }

  /* ── DETAIL MODAL ── */
  .modal-backdrop {
    position: fixed; inset: 0;
    background: rgba(26, 26, 46, 0.72);
    z-index: 100;
    display: none;
    align-items: center; justify-content: center;
    padding: 24px;
    animation: mFade 0.22s ease both;
  }
  .modal-backdrop.open { display: flex; }
  @keyframes mFade { from { opacity: 0 } to { opacity: 1 } }

  /* wrapper lets the close button escape overflow:hidden */
  .modal-card-wrap {
    position: relative;
    width: 100%; max-width: 360px;
    animation: mPop 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  }
  @keyframes mPop {
    0%   { transform: scale(0.5) rotate(-5deg); opacity: 0; }
    60%  { transform: scale(1.05) rotate(2deg); opacity: 1; }
    100% { transform: scale(1)   rotate(0);    opacity: 1; }
  }
  .modal-card {
    width: 100%;
    background: var(--white);
    border-radius: 24px;
    border: 4px solid var(--navy);
    overflow: hidden;
    box-shadow: 0 8px 0 var(--navy), 0 18px 40px rgba(0,0,0,0.32);
  }
  .modal-close {
    position: absolute; top: -14px; right: -14px;
    width: 40px; height: 40px; border-radius: 50%;
    background: var(--red); color: var(--white);
    border: 3px solid var(--navy);
    font-size: 20px; font-weight: 700; font-family: sans-serif;
    cursor: pointer; z-index: 10;
    display: flex; align-items: center; justify-content: center;
    line-height: 1;
    box-shadow: 0 3px 0 var(--navy);
    transition: transform 0.12s;
  }
  .modal-close:active { transform: scale(0.92); }

  .modal-img-wrap {
    width: 100%; aspect-ratio: 1/1;
    background: var(--theme-mid);
    display: flex; align-items: center; justify-content: center;
    position: relative;
    overflow: hidden;
  }
  .modal-img-wrap img {
    width: 100%; height: 100%; object-fit: contain; padding: 22px;
  }
  .modal-img-wrap .c-no-img i { font-size: 60px; }

  .modal-new-tag {
    position: absolute; top: 14px; left: 14px;
    background: var(--red); color: var(--yellow);
    font-family: 'Fredoka One', cursive;
    font-size: 14px;
    padding: 6px 14px;
    border: 3px solid var(--navy);
    border-radius: 12px;
    letter-spacing: 0.7px;
    box-shadow: 0 3px 0 var(--navy);
    transform: rotate(-8deg);
    animation: tagWiggle 1.8s ease-in-out infinite;
    z-index: 3;
    pointer-events: none;
  }

  /* modal price chip: bottom-right of image, clear of the X button */
  .modal-price-chip {
    bottom: 14px; right: 0;
    font-size: 17px;
    padding: 7px 18px 7px 30px;
    transform: rotate(-6deg);
    transform-origin: right center;
    z-index: 3;
  }

  .modal-info {
    padding: 18px 20px 6px;
    border-top: 3px solid var(--navy);
  }
  .modal-cat {
    font-size: 11px; font-weight: 700; color: #666;
    text-transform: uppercase; letter-spacing: 0.6px;
    margin-bottom: 6px;
  }
  .modal-name {
    font-family: 'Fredoka One', cursive;
    font-size: 22px; color: var(--navy);
    line-height: 1.1;
    word-wrap: break-word;
  }

  .modal-bag-btn {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    margin: 16px 18px 20px;
    padding: 16px 20px;
    background: var(--red); color: var(--white);
    border: 3px solid var(--navy);
    border-radius: 18px;
    font-family: 'Fredoka One', cursive;
    font-size: 17px; letter-spacing: 1px;
    text-transform: uppercase;
    text-decoration: none;
    box-shadow: 0 5px 0 var(--navy);
    transition: transform 0.12s, box-shadow 0.12s, background 0.15s;
  }
  .modal-bag-btn:active {
    transform: translateY(3px);
    box-shadow: 0 2px 0 var(--navy);
  }
  .modal-bag-btn i { font-size: 22px; }
  .modal-bag-btn.disabled {
    background: #aaa;
    pointer-events: none;
  }

  /* ═══════════════════════════════════════════════
     GAME SHOP UI POLISH
     ═══════════════════════════════════════════════ */

  /* Scanline overlay — subtle CRT feel */
  #shell::after {
    content: '';
    position: absolute; inset: 0;
    background: repeating-linear-gradient(
      to bottom,
      transparent 0px, transparent 3px,
      rgba(0,0,0,0.022) 3px, rgba(0,0,0,0.022) 4px
    );
    pointer-events: none;
    z-index: 998;
  }

  /* HUD topbar glow + pixel dash trim */
  .topbar {
    box-shadow: 0 3px 0 var(--navy), 0 5px 20px rgba(228,0,15,0.45);
    position: relative;
  }
  .topbar::after {
    content: '';
    position: absolute;
    bottom: -6px; left: 0; right: 0; height: 3px;
    background: repeating-linear-gradient(
      to right,
      var(--yellow) 0px, var(--yellow) 8px,
      transparent 8px, transparent 13px
    );
    pointer-events: none;
  }
  .topbar-title {
    animation: hudGlow 4s ease-in-out infinite;
  }
  @keyframes hudGlow {
    0%, 100% { filter: brightness(1); }
    50%      { filter: brightness(1.3) drop-shadow(0 0 6px rgba(255,255,255,0.5)); }
  }
  .topbar-total.visible {
    animation: goldPulse 2.8s ease-in-out infinite;
  }
  @keyframes goldPulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(249,211,8,0); }
    50%      { box-shadow: 0 0 0 3px rgba(249,211,8,0.5); }
  }

  /* Tab bar — active glow + press */
  .tab-btn { transition: color 0.15s, transform 0.1s; }
  .tab-btn:active { transform: scale(0.86); }
  .tab-btn.active { text-shadow: 0 0 8px rgba(249,211,8,0.55); }
  .tab-btn.active i { filter: drop-shadow(0 0 5px rgba(249,211,8,0.9)); }

  /* D-pad nav buttons */
  .ctrl-btn {
    border-radius: 10px;
    box-shadow: 0 5px 0 rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.1);
  }
  .ctrl-btn:active {
    transform: translateY(4px) scale(0.95);
    box-shadow: 0 1px 0 rgba(0,0,0,0.5);
  }

  /* Slide window — chunky 3D frame */
  .slide-window {
    border-width: 4px;
    border-radius: 16px;
    box-shadow:
      0 6px 0 var(--navy),
      0 10px 32px rgba(26,26,46,0.2),
      inset 0 1px 0 rgba(255,255,255,0.55);
    transition: box-shadow 0.5s ease;
    cursor: pointer;
  }
  .slide-window.glow-new {
    box-shadow:
      0 6px 0 #8b6800,
      0 0 0 3px #FFD700,
      0 0 28px rgba(255,215,0,0.55),
      0 10px 32px rgba(26,26,46,0.2);
  }

  /* Shimmer ray on slide */
  .shimmer-ray {
    position: absolute;
    inset: 0;
    background: linear-gradient(
      108deg,
      transparent 30%,
      rgba(255,255,255,0.32) 50%,
      transparent 70%
    );
    animation: shimmerRay 0.55s ease forwards;
    pointer-events: none;
    z-index: 5;
  }
  @keyframes shimmerRay {
    from { clip-path: inset(0 100% 0 0); }
    to   { clip-path: inset(0 0% 0 100%); }
  }

  /* Dots → rotating diamonds */
  .dot {
    width: 9px; height: 9px;
    border-radius: 2px;
    transform: rotate(45deg);
    transition: all 0.25s;
  }
  .dot.on {
    background: var(--red);
    width: 9px;
    border-radius: 2px;
    box-shadow: 0 0 8px rgba(228,0,15,0.65);
  }

  /* Discover title deeper shadow */
  .discover-title {
    letter-spacing: 3px;
    text-shadow:
      3px 3px 0 rgba(107,79,187,0.35),
      0 0 22px rgba(107,79,187,0.25);
  }

  /* Category headers — game section label */
  .cat-title {
    background: var(--navy);
    color: var(--yellow);
    padding: 3px 10px 3px 8px;
    border-radius: 6px;
    font-size: 12px;
    letter-spacing: 1.2px;
    display: inline-flex; align-items: center; gap: 5px;
  }
  .cat-title::before {
    content: '▶';
    font-size: 8px;
    color: var(--red);
    animation: arrowBlink 1.1s step-end infinite;
  }
  @keyframes arrowBlink {
    0%, 100% { opacity: 1; }
    50%      { opacity: 0; }
  }
  .cat-count {
    background: var(--red);
    color: var(--white);
    border-color: #800008;
    font-family: 'Fredoka One', cursive;
  }

  /* Library grid — faint inventory grid lines */
  .lib-grid {
    background:
      linear-gradient(rgba(26,26,46,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(26,26,46,0.04) 1px, transparent 1px);
    background-size: 22px 22px;
  }

  /* Library cards — 3D shadow, press animation */
  .lib-card {
    box-shadow: 0 4px 0 var(--navy);
    transition: transform 0.14s, box-shadow 0.14s;
  }
  .lib-card:active {
    transform: translateY(3px);
    box-shadow: 0 1px 0 var(--navy);
  }
  /* Inner inset border (RPG item card feel) */
  .lib-img-wrap::after {
    content: '';
    position: absolute; inset: 0;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.4);
    pointer-events: none; z-index: 2;
  }
  /* Rarity: NEW items get gold */
  .lib-card.rarity-new {
    border-color: #c8960a;
    box-shadow: 0 4px 0 #8b6800, 0 0 16px rgba(200,150,10,0.4);
  }
  .lib-card.rarity-new .lib-meta {
    background: linear-gradient(180deg, #fffbea 0%, var(--white) 100%);
    border-top-color: #c8960a;
  }

  /* Modal — item detail screen */
  .modal-card { border-width: 4px; }
  .modal-img-wrap::after {
    content: '— ITEM PREVIEW —';
    position: absolute; bottom: 0; left: 0; right: 0;
    background: linear-gradient(transparent, rgba(26,26,46,0.52));
    color: rgba(255,255,255,0.72);
    font-size: 9px; font-family: 'Fredoka One', cursive;
    letter-spacing: 2.5px; text-align: center;
    padding: 30px 0 8px;
    pointer-events: none; z-index: 2;
  }
  /* Shine sweep on bag button */
  .modal-bag-btn { position: relative; overflow: hidden; }
  .modal-bag-btn::before {
    content: '';
    position: absolute; top: 0; left: -100%; bottom: 0; width: 50%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.22), transparent);
    animation: btnShine 3s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes btnShine {
    0%, 30%  { left: -80%; }
    60%, 100% { left: 130%; }
  }

  /* Save button — 3D press + shine */
  .save-btn {
    box-shadow: 0 5px 0 #800008;
    letter-spacing: 1.5px;
    position: relative; overflow: hidden;
    transition: transform 0.1s, box-shadow 0.1s;
  }
  .save-btn:active {
    transform: translateY(4px);
    box-shadow: 0 1px 0 #800008;
  }
  .save-btn::before {
    content: '';
    position: absolute; top: 0; left: -100%; bottom: 0; width: 45%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
    animation: btnShine 2.4s 0.5s ease-in-out infinite;
    pointer-events: none;
  }

  /* Go-add button game style */
  .go-add-btn {
    box-shadow: 0 4px 0 #800008;
    transition: transform 0.1s, box-shadow 0.1s;
  }
  .go-add-btn:active {
    transform: translateY(3px);
    box-shadow: 0 1px 0 #800008;
  }

  /* ── ACQUIRE ANIMATIONS ── */
  .float-text {
    position: fixed; pointer-events: none; z-index: 9999;
    font-family: 'Fredoka One', cursive; font-size: 15px;
    color: var(--yellow);
    text-shadow: 2px 2px 0 var(--navy), 0 0 14px rgba(249,211,8,0.7);
    animation: floatUp 1.5s ease-out forwards;
    white-space: nowrap; letter-spacing: 1px;
  }
  @keyframes floatUp {
    0%   { transform: translateY(0) scale(0.5); opacity: 0; }
    15%  { transform: translateY(-18px) scale(1.2); opacity: 1; }
    100% { transform: translateY(-110px) scale(0.9); opacity: 0; }
  }
  .coin-float {
    position: fixed; pointer-events: none; z-index: 9999;
    font-size: 20px; line-height: 1;
    animation: coinSpin 1.4s ease-out forwards;
  }
  @keyframes coinSpin {
    0%   { transform: translateY(0) scale(0.8) rotate(0deg);   opacity: 1; }
    55%  { transform: translateY(-65px) scale(1.1) rotate(210deg); opacity: 1; }
    100% { transform: translateY(-130px) scale(0.6) rotate(390deg); opacity: 0; }
  }
</style>
</head>
<body>

<div id="shell">
  <!-- TOP BAR -->
  <div class="topbar">
    <div class="topbar-left">
      <div class="topbar-title">✦ sticker board</div>
      <div class="topbar-sub" id="page-sub">discover</div>
    </div>
    <div class="topbar-right">
      <div class="topbar-badge" id="top-badge">0 items</div>
      <div class="topbar-total" id="top-total"></div>
    </div>
  </div>

  <!-- CAROUSEL PAGE -->
  <div class="page active" id="page-carousel">
    <div class="bg-sparkles" id="bg-sparkles"></div>

    <div class="carousel-scene">

      <div id="c-empty" class="c-empty" style="display:none">
        <i class="ti ti-sparkles"></i>
        <p>no stickers yet — add some!</p>
        <button class="go-add-btn" id="go-add-btn">+ add sticker</button>
      </div>

      <div id="c-main" style="width:100%;display:flex;flex-direction:column;align-items:center;gap:14px">
        <div class="discover-header">
          <span class="ds-spark">✦</span>
          <span class="discover-title">DISCOVER</span>
          <span class="ds-spark r">✦</span>
        </div>

        <div class="slide-window" id="slide-window">
          <div class="c-card" id="c-card">
            <div class="c-img-wrap" id="c-img-wrap">
              <div class="c-no-img">
                <i class="ti ti-sparkles"></i>
                <span>add stickers!</span>
              </div>
            </div>
            <div class="price-tag c-price-chip" id="c-price-chip" style="display:none"></div>
            <div class="c-info">
              <div class="c-name" id="c-name">—</div>
              <div class="c-cat" id="c-cat">—</div>
              <div class="c-tap-hint" id="c-tap-hint" style="display:none">
                <i class="ti ti-hand-finger"></i> tap card for details
              </div>
            </div>
          </div>
        </div>

        <div class="dots" id="dots"></div>

        <div class="ctrl-row">
          <button class="ctrl-btn" id="prev-btn" aria-label="previous">
            <i class="ti ti-arrow-left"></i>
          </button>
          <div class="slide-counter" id="slide-counter">1 / 1</div>
          <button class="ctrl-btn" id="next-btn" aria-label="next">
            <i class="ti ti-arrow-right"></i>
          </button>
        </div>
      </div>

    </div>

    <div id="cat-sections"></div>
  </div>

  <!-- LIBRARY PAGE -->
  <div class="page" id="page-library">
    <div class="lib-actions">
      <button class="lib-action-btn" id="export-btn">
        <i class="ti ti-download"></i> export
      </button>
      <button class="lib-action-btn" id="import-btn">
        <i class="ti ti-upload"></i> import
      </button>
    </div>
    <div class="lib-pills" id="lib-pills"></div>
    <div class="lib-grid" id="lib-grid"></div>
  </div>

  <!-- ADD PAGE -->
  <div class="page" id="page-add">
    <div class="add-inner">
      <div class="dz" id="dz">
        <div class="dz-hint">
          <i class="ti ti-photo-up"></i>
          <p>tap to upload image</p>
          <span>or paste from clipboard (⌘V / long-press → paste)</span>
        </div>
      </div>
      <p class="paste-note">…or paste an image URL below</p>
      <div class="fl">
        <label>image URL</label>
        <div class="paste-row" id="url-in">
          <span class="pr-icon"><i class="ti ti-clipboard"></i></span>
          <input class="pr-input" id="url-in-input" type="url" inputmode="url"
                 placeholder="tap &amp; paste image URL" autocomplete="off" autocorrect="off" autocapitalize="off">
          <button class="paste-clear" type="button" id="url-in-clear" aria-label="clear">×</button>
        </div>
      </div>
      <div class="fl">
        <label>product name</label>
        <input class="fi" id="name-in" type="text" placeholder="e.g. gold hoop earrings">
      </div>
      <div class="fl">
        <label>product link</label>
        <div class="paste-row" id="link-in">
          <span class="pr-icon"><i class="ti ti-clipboard"></i></span>
          <input class="pr-input" id="link-in-input" type="url" inputmode="url"
                 placeholder="tap &amp; paste product link" autocomplete="off" autocorrect="off" autocapitalize="off">
          <button class="paste-clear" type="button" id="link-in-clear" aria-label="clear">×</button>
        </div>
      </div>
      <div class="fl">
        <label>price (optional)</label>
        <input class="fi" id="price-in" type="text" inputmode="decimal" placeholder="e.g. $25.00">
      </div>
      <div class="fl">
        <label>category</label>
        <select class="fs" id="cat-sel">
          <option value="Clothes">👗 Clothes</option>
          <option value="Accessories">👜 Accessories</option>
          <option value="Jewelry">💍 Jewelry</option>
          <option value="Shoes">👟 Shoes</option>
          <option value="Beauty">💄 Beauty</option>
          <option value="Home">🏠 Home</option>
          <option value="Other">📌 Other</option>
        </select>
      </div>
      <button class="save-btn" id="save-btn">save sticker!</button>
      <div class="toast" id="toast">✓ sticker saved!</div>
    </div>
  </div>

  <!-- BOTTOM TABS -->
  <div class="tabs">
    <button class="tab-btn active" data-page="carousel">
      <i class="ti ti-sparkles"></i>discover
    </button>
    <button class="tab-btn" data-page="library">
      <i class="ti ti-layout-grid"></i>library
    </button>
    <button class="tab-btn" data-page="add">
      <i class="ti ti-circle-plus"></i>add
    </button>
  </div>
</div>

<input type="file" id="file-in" accept="image/*" style="display:none">

<!-- DETAIL MODAL -->
<div class="modal-backdrop" id="detail-modal" aria-hidden="true">
  <div class="modal-card-wrap" id="detail-card" role="dialog" aria-modal="true">
    <button class="modal-close" id="detail-close" aria-label="close">×</button>
    <div class="modal-card">
      <div class="modal-img-wrap" id="detail-img-wrap"></div>
      <div class="modal-info">
        <div class="modal-cat" id="detail-cat"></div>
        <div class="modal-name" id="detail-name"></div>
      </div>
      <a class="modal-bag-btn" id="detail-bag" target="_blank" rel="noopener" href="#">
        <i class="ti ti-shopping-bag"></i>
        <span id="detail-bag-text">shop now</span>
      </a>
    </div>
  </div>
</div>

<script>
  const CAT_EMOJI = { Clothes:'👗', Accessories:'👜', Jewelry:'💍', Shoes:'👟', Beauty:'💄', Home:'🏠', Other:'📌' };

  const THEMES = [
    { bg:'#f5f0ff', mid:'#ede5ff', dot:'#c4b5ff', btn:'#6B4FBB' },
    { bg:'#fff0f5', mid:'#ffe0ec', dot:'#ffb3cc', btn:'#D4537E' },
    { bg:'#f0f9ff', mid:'#dff0ff', dot:'#93d4ff', btn:'#185FA5' },
    { bg:'#f0fff6', mid:'#d6ffeb', dot:'#8de8bb', btn:'#0F6E56' },
    { bg:'#fffbf0', mid:'#fff3cc', dot:'#ffd966', btn:'#BA7517' },
    { bg:'#fff0ed', mid:'#ffe3de', dot:'#ffb3a0', btn:'#993C1D' },
    { bg:'#f5f5f5', mid:'#ebebeb', dot:'#c8c8c8', btn:'#444441' },
  ];

  let stickers = [];
  let libFilter = 'All';
  let order = [];
  let cidx = 0;
  let autoTimer = null;
  let pendImg = null;
  let isAnimating = false;
  let justAddedId = null;

  /* ── INDEXEDDB STORAGE ── */
  const DB_NAME = 'stickerblast';
  const STORE = 'stickers';
  const LS_KEY = 'sb-nint-v2';
  let dbPromise = null;

  function openDB() {
    if (dbPromise) return dbPromise;
    dbPromise = new Promise((resolve, reject) => {
      if (!('indexedDB' in window)) { reject(new Error('no IndexedDB')); return; }
      const req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = () => {
        const db = req.result;
        if (!db.objectStoreNames.contains(STORE)) {
          db.createObjectStore(STORE, { keyPath: 'id' });
        }
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
    return dbPromise;
  }

  async function dbAll() {
    const db = await openDB();
    return new Promise((res, rej) => {
      const tx = db.transaction(STORE, 'readonly');
      const req = tx.objectStore(STORE).getAll();
      req.onsuccess = () => res(req.result || []);
      req.onerror = () => rej(req.error);
    });
  }

  async function dbReplaceAll(arr) {
    const db = await openDB();
    return new Promise((res, rej) => {
      const tx = db.transaction(STORE, 'readwrite');
      const store = tx.objectStore(STORE);
      store.clear();
      for (const s of arr) store.put(s);
      tx.oncomplete = () => res(true);
      tx.onerror = () => rej(tx.error);
      tx.onabort = () => rej(tx.error || new Error('aborted'));
    });
  }

  async function saveAll() {
    try {
      await dbReplaceAll(stickers);
      return true;
    } catch (e) {
      console.error('save failed', e);
      alert("⚠ Couldn't save — your device storage may be very full. Tap Export to back up, then remove some stickers to free space.");
      return false;
    }
  }

  function getNewIds() {
    return new Set(stickers.slice(0, 3).map(s => s.id));
  }

  function formatPrice(p) {
    if (!p) return '';
    const t = String(p).trim();
    if (!t) return '';
    return /^[\d.]/.test(t) ? '$' + t : t;
  }

  function escapeAttr(v) {
    return String(v == null ? '' : v).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  /* ── IMAGE COMPRESSION ── */
  function compressImage(src, maxDim = 1200) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => {
        let w = img.naturalWidth || img.width;
        let h = img.naturalHeight || img.height;
        if (!w || !h) { reject(new Error('bad dimensions')); return; }
        if (w > maxDim || h > maxDim) {
          const ratio = Math.min(maxDim / w, maxDim / h);
          w = Math.round(w * ratio);
          h = Math.round(h * ratio);
        }
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        const ctx = c.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);

        // detect transparency by scanning the alpha channel
        let hasAlpha = false;
        try {
          const px = ctx.getImageData(0, 0, w, h).data;
          for (let i = 3; i < px.length; i += 4) {
            if (px[i] < 255) { hasAlpha = true; break; }
          }
        } catch (e) { /* cross-origin image — treat as opaque */ }

        try {
          if (hasAlpha) {
            // WebP supports transparency + lossy compression (iOS 14+)
            // falls back to PNG on older browsers
            const webp = c.toDataURL('image/webp', 0.85);
            resolve(webp.startsWith('data:image/webp') ? webp : c.toDataURL('image/png'));
          } else {
            // fully opaque — fill white behind image then JPEG for smallest size
            ctx.globalCompositeOperation = 'destination-over';
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, w, h);
            resolve(c.toDataURL('image/jpeg', 0.82));
          }
        } catch (e) { reject(e); }
      };
      img.onerror = () => reject(new Error('image load failed'));
      img.src = src;
    });
  }

  async function maybeCompress(src) {
    // only compress data: URLs (uploaded/pasted files). External URLs pass through.
    if (!src || !src.startsWith('data:')) return src;
    try { return await compressImage(src); }
    catch (e) { console.warn('compress failed, using original', e); return src; }
  }

  function exportData() {
    if (!stickers.length) {
      alert("Nothing to export yet — add some stickers first!");
      return;
    }
    const blob = new Blob([JSON.stringify(stickers, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `sticker-board-${new Date().toISOString().slice(0,10)}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  function importData() {
    const inp = document.createElement('input');
    inp.type = 'file';
    inp.accept = 'application/json,.json';
    inp.onchange = e => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = async ev => {
        let imported;
        try {
          imported = JSON.parse(ev.target.result);
          if (!Array.isArray(imported)) throw new Error('not an array');
        } catch (err) {
          alert("Couldn't read that file — make sure it's a sticker-board export.");
          return;
        }
        imported.forEach((s, i) => { if (s && !s.id) s.id = Date.now() + i; });
        const existing = new Set(stickers.map(s => s.id));
        const fresh = imported.filter(s => s && s.id && !existing.has(s.id));
        if (!fresh.length) {
          alert("Nothing new to import — already up to date.");
          return;
        }
        if (!confirm(`Import ${fresh.length} new sticker${fresh.length === 1 ? '' : 's'}?`)) return;
        stickers = [...fresh, ...stickers];
        if (await saveAll()) {
          order = shuffle([...Array(stickers.length).keys()]);
          cidx = 0;
          renderLibrary();
          updateBadge();
        } else {
          stickers = stickers.slice(fresh.length);
        }
      };
      reader.readAsText(file);
    };
    inp.click();
  }

  function shuffle(a) {
    const r = [...a];
    for (let i = r.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [r[i], r[j]] = [r[j], r[i]];
    }
    return r;
  }

  function applyTheme(t) {
    const s = document.getElementById('shell');
    s.style.setProperty('--page-bg', t.bg);
    s.style.setProperty('--theme-mid', t.mid);
    s.style.setProperty('--theme-dot', t.dot);
    s.style.setProperty('--theme-btn', t.btn);
    const wrap = document.getElementById('c-img-wrap');
    if (wrap) wrap.style.background = t.mid;
  }

  function extractColor(img, cb) {
    const canvas = document.createElement('canvas');
    canvas.width = 20; canvas.height = 20;
    const ctx = canvas.getContext('2d');
    try {
      ctx.drawImage(img, 0, 0, 20, 20);
      const d = ctx.getImageData(0, 0, 20, 20).data;
      let r = 0, g = 0, b = 0, count = 0;
      for (let i = 0; i < d.length; i += 4) {
        const alpha = d[i+3];
        const isWhite = d[i] > 240 && d[i+1] > 240 && d[i+2] > 240;
        const isBlack = d[i] < 15 && d[i+1] < 15 && d[i+2] < 15;
        if (alpha > 80 && !isWhite && !isBlack) {
          r += d[i]; g += d[i+1]; b += d[i+2]; count++;
        }
      }
      if (count > 0) {
        r = Math.round(r / count); g = Math.round(g / count); b = Math.round(b / count);
        cb(r, g, b);
      } else {
        cb(null);
      }
    } catch(e) { cb(null); }
  }

  function applyDynamicColor(r, g, b) {
    if (r === null) { applyTheme(THEMES[cidx % THEMES.length]); return; }
    const bg  = `rgb(${Math.round(r*0.10+232)},${Math.round(g*0.10+227)},${Math.round(b*0.10+232)})`;
    const mid = `rgb(${Math.round(r*0.16+218)},${Math.round(g*0.16+213)},${Math.round(b*0.16+218)})`;
    const dot = `rgb(${Math.round(r*0.50+115)},${Math.round(g*0.50+105)},${Math.round(b*0.50+115)})`;
    const btn = `rgb(${Math.round(r*0.50+45)}, ${Math.round(g*0.42+32)}, ${Math.round(b*0.50+45)})`;
    const s = document.getElementById('shell');
    s.style.setProperty('--page-bg', bg);
    s.style.setProperty('--theme-mid', mid);
    s.style.setProperty('--theme-dot', dot);
    s.style.setProperty('--theme-btn', btn);
    const wrap = document.getElementById('c-img-wrap');
    if (wrap) wrap.style.background = mid;
  }

  /* ── PAGE ROUTING ── */
  const pageSubs = { carousel: 'discover', library: 'my library', add: 'add sticker' };

  function showPage(id) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('page-' + id).classList.add('active');
    document.querySelector('[data-page="' + id + '"]').classList.add('active');
    document.getElementById('page-sub').textContent = pageSubs[id];
    if (id === 'carousel') { startAuto(); renderCarousel(); }
    else { stopAuto(); }
    if (id === 'library') renderLibrary();
    else updateBadge();
  }

  document.querySelectorAll('.tab-btn').forEach(b => {
    b.addEventListener('click', () => showPage(b.dataset.page));
  });

  function parsePrice(p) {
    if (!p) return null;
    const n = parseFloat(String(p).replace(/[^0-9.]/g, ''));
    return isNaN(n) ? null : n;
  }

  function updateBadge(filterCat) {
    const scope = filterCat && filterCat !== 'All'
      ? stickers.filter(s => s.cat === filterCat)
      : stickers;
    const n = scope.length;
    const label = filterCat && filterCat !== 'All' ? filterCat : null;
    document.getElementById('top-badge').textContent =
      (label ? label + ': ' : '') + n + (n === 1 ? ' item' : ' items');

    const total = scope.reduce((sum, s) => sum + (parsePrice(s.price) || 0), 0);
    const totalEl = document.getElementById('top-total');
    if (total > 0) {
      totalEl.textContent = '🛍 $' + total.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      totalEl.classList.add('visible');
    } else {
      totalEl.classList.remove('visible');
    }
  }

  /* ── AUTOPLAY ── */
  function startAuto() {
    stopAuto();
    if (stickers.length > 1) {
      autoTimer = setInterval(() => navigate(1), 3500);
    }
  }

  function stopAuto() {
    clearInterval(autoTimer);
    autoTimer = null;
  }

  /* ── CAROUSEL ── */
  function renderCarousel() {
    const empty = document.getElementById('c-empty');
    const main = document.getElementById('c-main');
    if (stickers.length === 0) {
      empty.style.display = 'flex';
      main.style.display = 'none';
      renderCategorySections();
      return;
    }
    empty.style.display = 'none';
    main.style.display = 'flex';
    if (order.length !== stickers.length) {
      order = shuffle([...Array(stickers.length).keys()]);
    }
    if (cidx >= order.length) cidx = 0;
    populateCard(stickers[order[cidx]]);
    renderDots();
    updateCounter();
    renderCategorySections();
  }

  function renderCategorySections() {
    const wrap = document.getElementById('cat-sections');
    if (!wrap) return;
    if (!stickers.length) { wrap.innerHTML = ''; return; }

    const newIds = getNewIds();
    const cats = Object.keys(CAT_EMOJI).filter(c => stickers.some(s => s.cat === c));

    wrap.innerHTML = cats.map(cat => {
      const items = stickers.filter(s => s.cat === cat);
      const shown = items.slice(0, 8);
      const tiles = shown.map(s => {
        const name = escapeAttr(s.name || 'untitled');
        const imgInner = s.img
          ? `<img src="${escapeAttr(s.img)}" alt="${name}" onerror="this.style.display='none'">`
          : `<i class="ti ti-photo-off"></i>`;
        const priceHtml = s.price ? `<div class="cat-tile-price">${escapeAttr(formatPrice(s.price))}</div>` : '';
        const newBadge = newIds.has(s.id) ? `<div class="new-tag">NEW!</div>` : '';
        const cartBtn = s.link ? `<div class="cat-tile-cart"><i class="ti ti-shopping-cart"></i></div>` : '';
        return `<div class="cat-tile" data-id="${s.id}">
          <div class="cat-tile-img">${imgInner}${newBadge}${cartBtn}</div>
          <div class="cat-tile-meta">
            <div class="cat-tile-name">${escapeAttr(s.name || 'untitled')}</div>
            ${priceHtml}
          </div>
        </div>`;
      }).join('');
      return `
        <div class="cat-section">
          <div class="cat-header">
            <div class="cat-title">${CAT_EMOJI[cat]} ${cat}</div>
            <div class="cat-count">${items.length}</div>
          </div>
          <div class="cat-row">
            ${tiles}
            <button class="cat-see-tile" data-cat="${escapeAttr(cat)}">
              <i class="ti ti-arrow-right-circle"></i>
              <span>see all</span>
            </button>
          </div>
        </div>
      `;
    }).join('');

    wrap.querySelectorAll('.cat-see-tile').forEach(btn => {
      btn.addEventListener('click', () => {
        libFilter = btn.dataset.cat;
        showPage('library');
      });
    });
    wrap.querySelectorAll('.cat-tile').forEach(t => {
      t.addEventListener('click', () => {
        const id = parseInt(t.dataset.id);
        const sticker = stickers.find(s => s.id === id);
        if (sticker) openDetail(sticker);
      });
    });
  }

  function populateCard(s) {
    const wrap = document.getElementById('c-img-wrap');
    if (s.img) {
      const tmpImg = new Image();
      tmpImg.crossOrigin = 'anonymous';
      tmpImg.onload = () => extractColor(tmpImg, (r, g, b) => applyDynamicColor(r, g, b));
      tmpImg.onerror = () => applyTheme(THEMES[cidx % THEMES.length]);
      tmpImg.src = s.img;
      wrap.innerHTML = `<img src="${s.img}" alt="${s.name || ''}" crossorigin="anonymous" onerror="this.parentNode.innerHTML='<div class=c-no-img><i class=ti ti-photo-off></i><span>no image</span></div>'">`;
    } else {
      wrap.innerHTML = `<div class="c-no-img"><i class="ti ti-photo-off"></i><span>no image</span></div>`;
      applyTheme(THEMES[cidx % THEMES.length]);
    }
    document.getElementById('c-name').textContent = s.name || 'untitled';
    document.getElementById('c-cat').textContent = (CAT_EMOJI[s.cat] || '') + ' ' + s.cat;
    const chip = document.getElementById('c-price-chip');
    if (s.price) {
      chip.textContent = formatPrice(s.price);
      chip.style.display = 'block';
      // restart pop animation when card changes
      chip.style.animation = 'none';
      void chip.offsetWidth;
      chip.style.animation = '';
    } else {
      chip.style.display = 'none';
    }
    const hint = document.getElementById('c-tap-hint');
    hint.style.display = (s.link || s.img) ? 'inline-flex' : 'none';

    // gold glow frame for NEW items
    const win = document.getElementById('slide-window');
    win.classList.toggle('glow-new', getNewIds().has(s.id));

    // NEW! tag + sparkle burst for the 3 most recent stickers
    const card = document.getElementById('c-card');
    card.querySelectorAll('.c-new-tag, .sparkle-burst').forEach(el => el.remove());
    const isNew = getNewIds().has(s.id);
    card.classList.toggle('is-new', isNew);
    if (isNew) {
      const tag = document.createElement('div');
      tag.className = 'c-new-tag';
      tag.textContent = 'NEW!';
      card.appendChild(tag);
      spawnSparkles(card);
    }
  }

  function spawnSparkles(parent) {
    const burst = document.createElement('div');
    burst.className = 'sparkle-burst';
    const emojis = ['✨','⭐','✦','✧','★','✨'];
    const count = 10;
    for (let i = 0; i < count; i++) {
      const s = document.createElement('span');
      s.className = 'sparkle';
      s.textContent = emojis[i % emojis.length];
      const angle = (Math.PI * 2 * i) / count + (Math.random() * 0.4);
      const dist = 70 + Math.random() * 50;
      s.style.setProperty('--dx', Math.cos(angle) * dist + 'px');
      s.style.setProperty('--dy', Math.sin(angle) * dist + 'px');
      s.style.animationDelay = (i * 0.04) + 's';
      burst.appendChild(s);
    }
    parent.appendChild(burst);
    setTimeout(() => burst.remove(), 1400);
  }

  function navigate(dir) {
    if (isAnimating || stickers.length === 0) return;
    isAnimating = true;

    const card = document.getElementById('c-card');
    const outClass = dir > 0 ? 'slide-out-left' : 'slide-out-right';
    const inClass  = dir > 0 ? 'slide-in-right'  : 'slide-in-left';

    card.classList.add(outClass);

    setTimeout(() => {
      cidx = (cidx + dir + order.length) % order.length;
      card.classList.remove(outClass);
      populateCard(stickers[order[cidx]]);
      renderDots();
      updateCounter();

      void card.offsetWidth;
      card.classList.add(inClass);

      // shimmer ray over the image on every slide
      const wrap = document.getElementById('c-img-wrap');
      const ray = document.createElement('div');
      ray.className = 'shimmer-ray';
      wrap.appendChild(ray);
      setTimeout(() => ray.remove(), 600);

      card.addEventListener('animationend', () => {
        card.classList.remove(inClass);
        isAnimating = false;
      }, { once: true });
    }, 380);
  }

  function renderDots() {
    const wrap = document.getElementById('dots');
    const total = order.length;
    const max = 8;
    if (total <= max) {
      wrap.innerHTML = order.map((_, i) =>
        `<div class="dot${i === cidx ? ' on' : ''}"></div>`
      ).join('');
    } else {
      let html = '';
      for (let i = 0; i < max; i++) {
        const isOn = i === Math.round(cidx * (max - 1) / (total - 1));
        html += `<div class="dot${isOn ? ' on' : ''}"></div>`;
      }
      wrap.innerHTML = html;
    }
  }

  function updateCounter() {
    const el = document.getElementById('slide-counter');
    if (el) el.textContent = (cidx + 1) + ' / ' + order.length;
  }

  document.getElementById('next-btn').addEventListener('click', () => {
    stopAuto(); navigate(1); startAuto();
  });
  document.getElementById('prev-btn').addEventListener('click', () => {
    stopAuto(); navigate(-1); startAuto();
  });
  document.getElementById('go-add-btn').addEventListener('click', () => showPage('add'));
  document.getElementById('export-btn').addEventListener('click', exportData);
  document.getElementById('import-btn').addEventListener('click', importData);

  /* ── LIBRARY ── */
  function renderLibrary() {
    updateBadge(libFilter);
    const pills = document.getElementById('lib-pills');
    const grid = document.getElementById('lib-grid');
    const usedCats = ['All', ...Object.keys(CAT_EMOJI).filter(c => stickers.some(s => s.cat === c))];

    pills.innerHTML = usedCats.map(c =>
      `<button class="pill${c === libFilter ? ' on' : ''}" data-cat="${c}">${
        c === 'All' ? 'all ✦' : (CAT_EMOJI[c] || '') + ' ' + c.toLowerCase()
      }</button>`
    ).join('');

    pills.querySelectorAll('.pill').forEach(p => {
      p.addEventListener('click', () => { libFilter = p.dataset.cat; renderLibrary(); });
    });

    const filtered = libFilter === 'All' ? stickers : stickers.filter(s => s.cat === libFilter);

    if (!filtered.length) {
      grid.innerHTML = `<div class="lib-empty"><i class="ti ti-layout-grid"></i><p>nothing here yet</p></div>`;
      return;
    }

    const newIds = getNewIds();
    grid.innerHTML = filtered.map(s => {
      const idx = stickers.indexOf(s);
      const img = s.img
        ? `<img class="lib-img" src="${escapeAttr(s.img)}" alt="${escapeAttr(s.name || '')}" onerror="this.style.display='none'">`
        : `<div class="lib-no-img"><i class="ti ti-photo-off"></i></div>`;
      const newBadge = newIds.has(s.id) ? `<div class="new-tag">NEW!</div>` : '';
      const cartBtn = s.link
        ? `<button class="lib-cart" type="button" aria-label="view product"><i class="ti ti-shopping-cart"></i></button>`
        : '';
      const priceHtml = s.price ? `<div class="lib-price">${escapeAttr(formatPrice(s.price))}</div>` : '';
      const popClass = (s.id === justAddedId) ? ' just-added' : '';
      const rarityClass = newIds.has(s.id) ? ' rarity-new' : '';
      return `<div class="lib-card${popClass}${rarityClass}" data-idx="${idx}">
        <div class="lib-img-wrap">
          ${img}
          ${newBadge}
          <button class="del-x" data-idx="${idx}">×</button>
          ${cartBtn}
        </div>
        <div class="lib-meta">
          <div class="lib-name">${escapeAttr(s.name || 'untitled')}</div>
          <div class="lib-cat">${CAT_EMOJI[s.cat] || ''} ${escapeAttr(s.cat)}</div>
          ${priceHtml}
        </div>
      </div>`;
    }).join('');

    // clear just-added marker after the pop plays so it doesn't replay on filter changes
    if (justAddedId !== null) {
      const popped = grid.querySelector('.lib-card.just-added');
      if (popped) {
        popped.addEventListener('animationend', () => {
          popped.classList.remove('just-added');
          justAddedId = null;
        }, { once: true });
      } else {
        justAddedId = null;
      }
    }

    grid.querySelectorAll('.del-x').forEach(btn => {
      btn.addEventListener('click', e => {
        e.stopPropagation();
        e.preventDefault();
        stickers.splice(parseInt(btn.dataset.idx), 1);
        order = shuffle([...Array(stickers.length).keys()]);
        cidx = 0;
        saveAll(); renderLibrary(); updateBadge();
      });
    });

    grid.querySelectorAll('.lib-card').forEach(card => {
      card.addEventListener('click', e => {
        if (e.target.closest('.del-x')) return;
        const idx = parseInt(card.dataset.idx);
        const sticker = stickers[idx];
        if (sticker) openDetail(sticker);
      });
    });
  }

  /* ── ADD PAGE ── */
  function setPreview(src) {
    pendImg = src;
    document.getElementById('dz').innerHTML = `<img src="${src}" alt="preview">`;
  }

  function clearAddForm() {
    pendImg = null;
    document.getElementById('dz').innerHTML = `
      <div class="dz-hint">
        <i class="ti ti-photo-up"></i>
        <p>tap to upload image</p>
        <span>or paste from clipboard (⌘V / long-press → paste)</span>
      </div>`;
    urlField.set('');
    linkField.set('');
    document.getElementById('name-in').value = '';
    document.getElementById('price-in').value = '';
    document.getElementById('cat-sel').value = 'Clothes';
  }

  document.getElementById('dz').addEventListener('click', () => {
    document.getElementById('file-in').click();
  });

  document.getElementById('file-in').addEventListener('change', e => {
    const file = e.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = async ev => {
      setPreview(ev.target.result);  // immediate preview
      const small = await maybeCompress(ev.target.result);
      setPreview(small);              // swap in compressed once ready
    };
    reader.readAsDataURL(file);
    e.target.value = '';
  });

  /* ── PASTE FIELDS ── */
  function setupPasteField(wrapperId, inputId, clearId, onValue) {
    const wrap  = document.getElementById(wrapperId);
    const input = document.getElementById(inputId);
    const clear = document.getElementById(clearId);

    function mark(filled) {
      wrap.classList.toggle('filled', filled);
    }

    input.addEventListener('input', () => {
      const v = input.value.trim();
      mark(!!v);
      if (v) onValue && onValue(v);
    });

    clear.addEventListener('click', e => {
      e.stopPropagation();
      input.value = '';
      mark(false);
      onValue && onValue('');
    });

    // tapping anywhere on the row focuses the input
    wrap.addEventListener('click', e => {
      if (e.target === clear) return;
      input.focus();
    });

    return {
      get: () => input.value.trim(),
      set: v => {
        input.value = v || '';
        mark(!!(v));
        if (v) onValue && onValue(v);
      },
    };
  }

  const urlField  = setupPasteField('url-in',  'url-in-input',  'url-in-clear',
    v => { if (v) setPreview(v); });
  const linkField = setupPasteField('link-in', 'link-in-input', 'link-in-clear', null);

  document.addEventListener('paste', e => {
    const items = e.clipboardData?.items;
    if (!items) return;
    for (const item of items) {
      if (item.type.startsWith('image/')) {
        const file = item.getAsFile();
        const reader = new FileReader();
        reader.onload = async ev => {
          showPage('add');
          setPreview(ev.target.result);
          const small = await maybeCompress(ev.target.result);
          setPreview(small);
        };
        reader.readAsDataURL(file);
      }
    }
  });

  document.getElementById('save-btn').addEventListener('click', async () => {
    const name  = document.getElementById('name-in').value.trim();
    const link  = linkField.get();
    const cat   = document.getElementById('cat-sel').value;
    const url   = urlField.get();
    const price = document.getElementById('price-in').value.trim();
    const img   = pendImg || url || null;

    const newSticker = { name: name || 'untitled', img, link, cat, price, id: Date.now() };
    stickers.unshift(newSticker);
    justAddedId = newSticker.id;
    order = shuffle([...Array(stickers.length).keys()]);
    const newPos = order.indexOf(0);
    if (newPos > -1) { [order[0], order[newPos]] = [order[newPos], order[0]]; }
    cidx = 0;

    const ok = await saveAll();
    if (!ok) {
      // rollback in-memory state so reality matches storage
      stickers.shift();
      justAddedId = null;
      order = shuffle([...Array(stickers.length).keys()]);
      return;
    }

    updateBadge();
    clearAddForm();

    const saveBtn = document.getElementById('save-btn');
    floatAcquired(saveBtn);
    spawnCoins(saveBtn);

    const toast = document.getElementById('toast');
    toast.style.opacity = '1';
    setTimeout(() => {
      toast.style.opacity = '0';
      setTimeout(() => showPage('library'), 300);
    }, 900);
  });

  /* ── GAME ANIMATIONS ── */
  function floatAcquired(anchorEl) {
    const rect = (anchorEl || document.getElementById('save-btn')).getBoundingClientRect();
    const el = document.createElement('div');
    el.className = 'float-text';
    el.textContent = '✦ ITEM ACQUIRED!';
    el.style.left = (rect.left + rect.width / 2) + 'px';
    el.style.top  = (rect.top - 8) + 'px';
    el.style.transform = 'translateX(-50%)';
    document.body.appendChild(el);
    el.addEventListener('animationend', () => el.remove(), { once: true });
  }

  function spawnCoins(anchorEl) {
    const rect = (anchorEl || document.getElementById('save-btn')).getBoundingClientRect();
    const coins = ['🪙','⭐','🪙','💛','🪙'];
    coins.forEach((c, i) => {
      setTimeout(() => {
        const el = document.createElement('div');
        el.className = 'coin-float';
        el.textContent = c;
        el.style.left = (rect.left + rect.width / 2 + (Math.random() - 0.5) * 60) + 'px';
        el.style.top  = rect.top + 'px';
        document.body.appendChild(el);
        el.addEventListener('animationend', () => el.remove(), { once: true });
      }, i * 90);
    });
  }

  /* ── DETAIL MODAL ── */
  function openDetail(sticker) {
    if (!sticker) return;
    stopAuto();
    document.getElementById('detail-name').textContent = sticker.name || 'untitled';
    document.getElementById('detail-cat').textContent =
      (CAT_EMOJI[sticker.cat] || '') + ' ' + sticker.cat;

    const wrap = document.getElementById('detail-img-wrap');
    wrap.innerHTML = sticker.img
      ? `<img src="${escapeAttr(sticker.img)}" alt="${escapeAttr(sticker.name || '')}">`
      : `<div class="c-no-img"><i class="ti ti-photo-off"></i><span>no image</span></div>`;

    if (getNewIds().has(sticker.id)) {
      const t = document.createElement('div');
      t.className = 'modal-new-tag';
      t.textContent = 'NEW!';
      wrap.appendChild(t);
    }
    if (sticker.price) {
      const p = document.createElement('div');
      p.className = 'price-tag modal-price-chip';
      p.textContent = formatPrice(sticker.price);
      wrap.appendChild(p);
    }

    const bag = document.getElementById('detail-bag');
    const bagText = document.getElementById('detail-bag-text');
    if (sticker.link) {
      bag.href = sticker.link;
      bag.classList.remove('disabled');
      bagText.textContent = 'shop now';
    } else {
      bag.href = '#';
      bag.classList.add('disabled');
      bagText.textContent = 'no link saved';
    }

    document.getElementById('detail-modal').classList.add('open');
  }
  function closeDetail() {
    document.getElementById('detail-modal').classList.remove('open');
    if (document.getElementById('page-carousel').classList.contains('active')) {
      startAuto();
    }
  }
  document.getElementById('detail-close').addEventListener('click', closeDetail);
  document.getElementById('detail-modal').addEventListener('click', e => {
    if (e.target.id === 'detail-modal') closeDetail();
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' &&
        document.getElementById('detail-modal').classList.contains('open')) {
      closeDetail();
    }
  });

  // tap on the main carousel card → detail modal
  document.getElementById('slide-window').addEventListener('click', () => {
    if (stickers.length === 0) return;
    openDetail(stickers[order[cidx]]);
  });

  /* ── DECORATIVE BG SPARKLES (carousel only) ── */
  function spawnBgSparkles() {
    const wrap = document.getElementById('bg-sparkles');
    if (!wrap || wrap.children.length) return;
    const glyphs = ['✦', '✧', '✶', '✺', '★'];
    for (let i = 0; i < 14; i++) {
      const s = document.createElement('span');
      s.className = 'bs';
      s.textContent = glyphs[i % glyphs.length];
      s.style.top = Math.random() * 100 + '%';
      s.style.left = Math.random() * 100 + '%';
      s.style.fontSize = (10 + Math.random() * 12) + 'px';
      s.style.animationDelay = (Math.random() * 6) + 's';
      s.style.animationDuration = (7 + Math.random() * 6) + 's';
      wrap.appendChild(s);
    }
  }

  /* ── INIT ── */
  async function boot() {
    try {
      stickers = await dbAll();
      // first run after upgrade: migrate any stickers still sitting in localStorage
      const lsRaw = localStorage.getItem(LS_KEY);
      if (!stickers.length && lsRaw) {
        try {
          const ls = JSON.parse(lsRaw);
          if (Array.isArray(ls) && ls.length) {
            ls.forEach((s, i) => { if (s && !s.id) s.id = Date.now() + i; });
            stickers = ls;
            await dbReplaceAll(stickers);
          }
        } catch (e) { console.warn('localStorage migration failed', e); }
      }
      // free the 5MB localStorage slot once IDB has the data
      if (lsRaw && stickers.length) {
        try { localStorage.removeItem(LS_KEY); } catch {}
      }
      // sort newest-first by id so unshift-based ordering is restored
      // (IndexedDB getAll returns insertion order, which after clear+put matches array order)
    } catch (e) {
      console.error('IndexedDB unavailable, falling back to localStorage', e);
      try {
        stickers = JSON.parse(localStorage.getItem(LS_KEY) || '[]');
      } catch { stickers = []; }
    }
    spawnBgSparkles();
    renderCarousel();
    updateBadge();
    startAuto();
  }
  boot();
</script>
</body>
</html>
